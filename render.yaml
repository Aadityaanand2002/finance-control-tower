services:
  - type: web
    name: finance-control-tower
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: DATA_PROVIDER
        value: mock
      - key: SERVE_FRONTEND
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:////data/finance_control_tower.db
    disk:
      name: fct-data
      mountPath: /data
      sizeGB: 1
